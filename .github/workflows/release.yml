name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Build releases share latest; version tags each have their own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: bash scripts/package-app.sh
      - run: bash scripts/package-dmg.sh
      - name: Package app ZIP
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DSH Native Pet.app" "dist/DSH-Native-Pet-macos-arm64.zip"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            "dist/dsh-native-pet-macos-arm64.dmg"
            "dist/DSH-Native-Pet-macos-arm64.zip"
          )
          notes="macOS arm64 build from ${GITHUB_SHA}. Ad-hoc signed; not notarised."
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="DSH Native Pet $tag"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes "$notes" --latest
            else
              gh release create "$tag" --title "$title" \
                --notes "$notes" --verify-tag --latest
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            tag="build-${timestamp}"
            title="Build ${timestamp:0:4}-${timestamp:4:2}-${timestamp:6:2} ${timestamp:9:2}:${timestamp:11:2} UTC"
            gh release create "$tag" "${assets[@]}" --title "$title" \
              --notes "$notes" --target "$GITHUB_SHA" --latest

            gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
              --jq 'add | map(select(.tag_name | startswith("build-"))) | sort_by(.created_at) | reverse | .[10:][] | .tag_name' |
              while IFS= read -r old_tag; do
                gh release delete "$old_tag" --yes --cleanup-tag
              done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-native-pet-macos
          path: dist/
