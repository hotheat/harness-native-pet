name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: bash scripts/package-app.sh
      - run: bash scripts/package-dmg.sh
      - name: Package app ZIP
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DSH Native Pet.app" "dist/DSH-Native-Pet-macos-arm64.zip"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            "dist/dsh-native-pet-macos-arm64.dmg"
            "dist/DSH-Native-Pet-macos-arm64.zip"
          )
          notes="macOS arm64 build from ${GITHUB_SHA}. Ad-hoc signed; not notarised."
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release edit "$tag" --title "DSH Native Pet $tag" --latest=false
            else
              gh release create "$tag" --title "DSH Native Pet $tag" \
                --notes "$notes" --verify-tag --latest=false
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            if ! gh release view latest > /dev/null 2>&1; then
              gh release create latest --title "Latest build" \
                --notes "$notes" --target "$GITHUB_SHA" --latest
            fi
            gh release upload latest "${assets[@]}" --clobber
            gh release edit latest --title "Latest build" --notes "$notes" --latest
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-native-pet-macos
          path: dist/
