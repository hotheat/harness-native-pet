name: Check
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm --prefix bridge ci
      - run: npm --prefix bridge test
      - run: npm --prefix bridge run test:e2e
      - run: swift test --package-path native
      - run: swift build --package-path native --product PetIPCSmoke
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-contracts.mjs
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: swift scripts/validate-assets.swift
      - run: swift scripts/validate-dsh-pet.swift
      - run: node scripts/smoke-ipc.mjs
      - run: bash scripts/package-app.sh
      - run: bash scripts/smoke-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-native-pet-macos
          path: dist/
